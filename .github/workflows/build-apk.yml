name: Build Midex APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Run host regressions
        run: bash tools/test-display.sh

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'

      - name: Build APK
        env:
          MIDEX_CI_KEYSTORE: ${{ github.ref == 'refs/heads/main' && secrets.MIDEX_CI_KEYSTORE || '' }}
          EXTBRIDGE_KEYSTORE_PASS: ${{ github.ref == 'refs/heads/main' && secrets.MIDEX_CI_KEYSTORE_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            : "${MIDEX_CI_KEYSTORE:?Missing CI signing key}" "${EXTBRIDGE_KEYSTORE_PASS:?Missing CI signing password}"
            export EXTBRIDGE_KEYSTORE="$RUNNER_TEMP/midex-ci.p12"
            trap 'rm -f "$EXTBRIDGE_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$MIDEX_CI_KEYSTORE" | base64 --decode > "$EXTBRIDGE_KEYSTORE"
            unset MIDEX_CI_KEYSTORE
          else
            unset EXTBRIDGE_KEYSTORE_PASS
          fi
          ./build_linux.sh --no-daemon --console=plain

      - name: Verify and name the APK
        id: apk
        run: |
          sdk="$ANDROID_HOME/build-tools/36.1.0"
          apk=build/out/exthelper.apk
          version=$(jq -er '.elements[0].versionName' helper/build/outputs/apk/debug/output-metadata.json)
          badging=$("$sdk/aapt2" dump badging "$apk")
          grep -F "package: name='com.extbridge.helper'" <<< "$badging"
          grep -F "versionName='$version'" <<< "$badging"
          grep -Fx "application-label:'Midex'" <<< "$badging"
          "$sdk/zipalign" -c -P 16 4 "$apk"
          mkdir -p dist
          name="Midex-$version"
          cp "$apk" "dist/$name.apk"
          "$sdk/apksigner" verify --verbose --print-certs "dist/$name.apk" | tee dist/apk-signature.txt
          (cd dist && sha256sum "$name.apk" > "$name.apk.sha256")
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/
          if-no-files-found: error
